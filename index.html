<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brian Maina — Poster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .poster {
    width: 100vw;
    min-height: 100vh;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 5vw, 4rem);
    position: relative;
    overflow: hidden;
  }

  /* Grid overlay */
  .poster::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(10,110,63,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,110,63,0.05) 1px, transparent 1px);
    background-size: clamp(60px, 10vw, 120px) clamp(60px, 10vw, 120px);
    pointer-events: none;
  }

  /* Watermark brackets */
  .watermark {
    position: absolute;
    right: -2vw;
    top: 50%;
    transform: translateY(-50%);
    font-family: monospace;
    font-size: clamp(120px, 28vw, 320px);
    font-weight: 700;
    background: linear-gradient(135deg, #0a6e3f, #0a4a6e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0.05;
    pointer-events: none;
    line-height: 1;
    z-index: 0;
  }

  /* Top & bottom bars */
  .top-bar, .bottom-bar {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #0a6e3f, #0a4a6e);
  }
  .top-bar { top: 0; }
  .bottom-bar { bottom: 0; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .bracket {
    font-family: monospace;
    font-size: clamp(22px, 4vw, 48px);
    font-weight: 700;
    background: linear-gradient(135deg, #0a6e3f, #0a4a6e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }

  .name-box {
    border: 1px solid transparent;
    border-radius: 6px;
    padding: clamp(4px, 1vw, 10px) clamp(8px, 1.5vw, 18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      linear-gradient(#f5f0e8, #f5f0e8) padding-box,
      linear-gradient(135deg, #0a6e3f, #0a4a6e) border-box;
    position: relative;
  }

  .name-box::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 5px;
    background: linear-gradient(135deg, rgba(10,110,63,0.06), rgba(10,74,110,0.06));
  }

  .name-first {
    font-family: monospace;
    font-size: clamp(9px, 1.6vw, 16px);
    font-weight: 700;
    color: #0a0a0a;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }

  .name-last {
    font-family: monospace;
    font-size: clamp(9px, 1.6vw, 16px);
    font-weight: 700;
    background: linear-gradient(135deg, #0a6e3f, #0a4a6e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }

  .location {
    font-size: clamp(9px, 1.2vw, 12px);
    color: #bbb;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Tag */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0.8px solid rgba(10,110,63,0.4);
    border-radius: 999px;
    padding: clamp(4px, 0.8vw, 8px) clamp(12px, 2vw, 20px);
    font-size: clamp(8px, 1.1vw, 11px);
    letter-spacing: 2px;
    color: #0a6e3f;
    width: fit-content;
    position: relative;
    z-index: 2;
  }

  .tag-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #0a6e3f;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Hero */
  .hero {
    position: relative;
    z-index: 2;
    line-height: 0.88;
  }

  .hero h1 {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(52px, 13vw, 160px);
    font-weight: 900;
    text-transform: uppercase;
  }

  .hero h1 .dark { color: #0a0a0a; display: block; }
  .hero h1 .grad {
    background: linear-gradient(135deg, #0a6e3f, #0a4a6e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
  }

  .repeat-line {
    font-size: clamp(10px, 1.5vw, 16px);
    color: #bbb;
    letter-spacing: clamp(2px, 0.5vw, 6px);
    margin-top: clamp(8px, 2vw, 20px);
  }

  /* Divider */
  .divider {
    height: 0.5px;
    background: linear-gradient(90deg, #0a6e3f, #0a4a6e);
    opacity: 0.2;
    position: relative;
    z-index: 2;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2vw, 24px);
    position: relative;
    z-index: 2;
  }

  .stat-item { display: flex; flex-direction: column; gap: 4px; }

  .stat-num {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(24px, 5vw, 56px);
    font-weight: 900;
    line-height: 1;
  }

  .stat-num.green { color: #0a6e3f; }
  .stat-num.blue { color: #0a4a6e; }
  .stat-num.dark { color: #0a0a0a; }

  .stat-label {
    font-size: clamp(7px, 1vw, 10px);
    color: #bbb;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Skills */
  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1vw, 12px);
    position: relative;
    z-index: 2;
  }

  .skill-tag {
    border-radius: 4px;
    padding: clamp(4px, 0.8vw, 8px) clamp(10px, 1.5vw, 20px);
    font-size: clamp(8px, 1vw, 11px);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .skill-tag.g { color: #0a6e3f; border: 0.8px solid rgba(10,110,63,0.4); }
  .skill-tag.b { color: #0a4a6e; border: 0.8px solid rgba(10,74,110,0.4); }

  /* Footer card */
  .footer-card {
    border: 0.8px solid rgba(10,110,63,0.25);
    border-radius: 10px;
    padding: clamp(12px, 2.5vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1vw, 10px);
    position: relative;
    z-index: 2;
    background: linear-gradient(135deg, rgba(10,110,63,0.04), rgba(10,74,110,0.04));
  }

  .footer-motto {
    font-family: 'Arial Black', sans-serif;
    font-size: clamp(10px, 2vw, 22px);
    font-weight: 900;
    color: #0a0a0a;
    letter-spacing: clamp(1px, 0.3vw, 3px);
    text-align: center;
  }

  .footer-link {
    font-size: clamp(8px, 1.1vw, 12px);
    color: #bbb;
    letter-spacing: 2px;
    text-align: center;
  }

  .footer-handle {
    font-size: clamp(8px, 1.1vw, 12px);
    color: #0a6e3f;
    letter-spacing: 2px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>
  <div class="watermark">&lt;/&gt;</div>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span class="bracket">&lt;</span>
      <div class="name-box">
        <span class="name-first">brian</span>
        <span class="name-last">maina</span>
      </div>
      <span class="bracket">/&gt;</span>
    </div>
    <div class="location">Nairobi, KE</div>
  </div>

  <!-- Tag -->
  <div class="tag">
    <div class="tag-dot"></div>
    BUILDING IN PUBLIC
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1>
      <span class="dark">Code.</span>
      <span class="grad">Design.</span>
      <span class="dark">Data.</span>
    </h1>
    <div class="repeat-line">REPEAT ∞</div>
  </div>

  <div class="divider"></div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-item">
      <span class="stat-num green">25</span>
      <span class="stat-label">Projects</span>
    </div>
    <div class="stat-item">
      <span class="stat-num blue">5</span>
      <span class="stat-label">Weeks</span>
    </div>
    <div class="stat-item">
      <span class="stat-num green">1</span>
      <span class="stat-label">Goal</span>
    </div>
    <div class="stat-item">
      <span class="stat-num dark">0</span>
      <span class="stat-label">Excuses</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Skills -->
  <div class="skills">
    <span class="skill-tag g">Web Dev</span>
    <span class="skill-tag b">Python</span>
    <span class="skill-tag g">Excel</span>
    <span class="skill-tag b">Design</span>
    <span class="skill-tag g">AI / ML</span>
  </div>

  <!-- Footer -->
  <div class="footer-card">
    <div class="footer-motto">Believe · Behave · Become</div>
    <div class="footer-link">bamaich.github.io/brian-portfolio</div>
    <div class="footer-handle">@t3kky_deux</div>
  </div>

</div>
</body>
</html>
